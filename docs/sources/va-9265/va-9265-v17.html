<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGO · Распределение свободной съёмки</title>
<style>
:root{
  --navy-900:#0E1E33;--navy-800:#1B2E47;--navy-700:#2B415A;--navy-600:#3A5578;
  --blue:#337AB7;--blue-600:#2A6496;--blue-300:#638EBF;--blue-100:#CFE0F0;--blue-050:#EDF3FA;
  --ok:#2E9E5B;--ok-bg:#E9F6EE;--warn:#D98E1F;--warn-bg:#FDF4E3;--danger:#D9534F;--danger-bg:#FBEBEA;
  --bg:#F4F6F9;--surface:#fff;--line:#E1E7EF;--line-2:#EEF2F7;
  --text:#20303F;--text-2:#55677A;--muted:#8A9AAB;--violet:#6B4FBB;
  --r:6px;--r-sm:4px;--shadow:0 1px 2px rgba(16,32,50,.06),0 3px 10px rgba(16,32,50,.07);
  --card:176px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font:14px/1.45 "PT Root UI","Open Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C7D2DE;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.app{display:grid;grid-template-rows:48px auto 1fr;height:100vh;overflow:hidden}

.topbar{background:var(--navy-900);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px}
.logo{font-weight:700;letter-spacing:.14em;font-size:13px;color:#9FB3CC}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:#9FB3CC}
.crumbs b{color:#fff;font-weight:600}
.tbtn{background:transparent;border:1px solid rgba(255,255,255,.22);color:#DCE6F2;border-radius:var(--r-sm);padding:5px 12px;font-size:13px}
.tbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.tbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.tbtn.primary:hover{background:var(--blue-600)}
.saved{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#8FC9A8}
.saved .dot{width:7px;height:7px;border-radius:50%;background:#4FBF7B}
.saved.busy{color:#E6C77E}.saved.busy .dot{background:#E6C77E;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

.subhead{background:var(--surface);border-bottom:1px solid var(--line);padding:11px 16px 0}
.sh-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sess-badge{background:var(--warn);color:#fff;border-radius:var(--r-sm);font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 7px;text-transform:uppercase}
.sess-meta{color:var(--text-2);font-size:13px}
.stats{display:flex;gap:20px;align-items:center;margin-left:auto}
.stat{min-width:152px;max-width:190px}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .val{font-size:14px;font-weight:600;margin-top:1px}
.bar{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.bar.ok i{background:var(--ok)}
.tabs{display:flex;gap:2px;margin-top:11px}
.tab{border:0;background:transparent;padding:8px 13px;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tab .n{color:var(--muted);font-weight:400;margin-left:5px}
.tab.on .n{color:var(--blue-300)}

.work{display:grid;grid-template-columns:1fr 6px 440px;min-height:0}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.work{grid-template-columns:1fr 10px 440px}
.splitter{background:transparent;cursor:col-resize;position:relative}
.splitter::after{content:"";position:absolute;inset:0 4px;background:var(--line);transition:background .12s}
.splitter::before{content:"";position:absolute;top:50%;left:2px;width:6px;height:34px;transform:translateY(-50%);
  border-radius:3px;background:#C7D2DE;opacity:0;transition:opacity .12s}
.splitter:hover::after{background:var(--blue-300)}
.splitter:hover::before{opacity:1}
.bar-tools{display:flex;align-items:center;gap:9px;row-gap:7px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.lbtn{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:5px 11px;font-size:13px;color:var(--text-2)}
.lbtn:hover{border-color:var(--blue-300);color:var(--blue-600)}
.lbtn.act{border-color:var(--blue);color:var(--blue-600);background:var(--blue-050)}
.lbtn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.lbtn.pri:hover{background:var(--blue-600);color:#fff}
.lbtn:disabled{opacity:.45;cursor:not-allowed}
.sizer{display:flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.sizer button{border:0;background:#fff;padding:5px 9px;font-size:12px;color:var(--text-2);border-left:1px solid var(--line)}
.sizer button:first-child{border-left:0}
.sizer button.on{background:var(--blue-050);color:var(--blue-600);font-weight:700}
.search{position:relative}
.search{flex:0 1 220px;min-width:130px}
.search input{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px 6px 28px;font:inherit;font-size:13px;width:100%;outline:none}
.search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);opacity:.45}

/* ---------- лента: плоская, без группировки ---------- */
.feed{flex:1;overflow:auto;padding:14px 16px 130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card),1fr));gap:9px;align-items:start}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;user-select:none;
  transition:box-shadow .12s,border-color .12s}
.card:hover{box-shadow:var(--shadow);border-color:#C9D6E4}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-100)}
.card.dragging{opacity:.4}
.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#DEE5ED}
.card .cap{display:flex;align-items:center;gap:5px;padding:4px 6px;font-size:11px;color:var(--text-2);border-top:1px solid var(--line-2);background:#fff}
.card .cap .sp{flex:1}
.chk{position:absolute;top:5px;left:5px;width:22px;height:22px;pointer-events:none;border-radius:4px;border:1.5px solid rgba(255,255,255,.9);
  background:rgba(14,30,51,.45);display:grid;place-items:center;z-index:2;opacity:0;transition:opacity .12s}
.chk svg{opacity:0;width:11px;height:11px}
.card:hover .chk{opacity:1;background:rgba(14,30,51,.6)}
.card.sel .chk{opacity:1;background:var(--blue);border-color:var(--blue)}
.card.sel .chk svg{opacity:1}
body.selmode .chk{opacity:1}
.ocrtag{position:absolute;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(transparent,rgba(14,30,51,.9) 45%);
  color:#fff;font-size:10px;padding:13px 5px 4px;line-height:1.25}
.ocrtag b{display:block;font-size:9.5px;font-weight:700;letter-spacing:.04em;color:#9FD0F5;text-transform:uppercase}
.card.hasocr{border-color:var(--blue-300)}
.mark{position:absolute;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(transparent,rgba(20,90,55,.94) 45%);
  color:#fff;font-size:10.5px;padding:14px 6px 5px;display:flex;align-items:center;gap:4px}
.mark b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mark b.loc{cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.55)}
.mark b.loc:hover{border-bottom-color:#fff}
.mark .find{flex:none;width:15px;height:15px;border-radius:3px;display:grid;place-items:center;background:rgba(255,255,255,.2);cursor:pointer}
.mark .find:hover{background:rgba(255,255,255,.45)}
.mark .x{margin-left:auto;flex:none;width:15px;height:15px;border-radius:3px;display:grid;place-items:center;background:rgba(255,255,255,.2)}
.mark .x:hover{background:rgba(255,255,255,.4)}
.card.placed{background:#F2F5F8;border-color:#E7ECF2}
.card.placed img{filter:grayscale(1) contrast(.9) opacity(.5)}
.card.placed .cap{color:#A6B3C1}
.card.placed:hover img{filter:grayscale(.3) opacity(.85)}
.card.placed.sel img{filter:none}
.segl{font-size:12px;color:var(--muted)}
.ctlgrp{display:flex;align-items:center;gap:7px;flex:none}
#curHint{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 40px;text-align:right}
.lbtn.addbtn{border-color:var(--blue-300);color:var(--blue-600);white-space:nowrap;padding:6px 13px}
.lbtn.addbtn:hover{background:var(--blue-050)}
.lbtn.wand{background:#F3EEFB;border-color:#DDD2F0;color:var(--violet);font-weight:600;display:inline-flex;align-items:center;gap:7px}
.lbtn.wand:hover{background:#E9E0F8;border-color:#C9B9EA;color:var(--violet)}
.review{display:none;align-items:center;gap:12px;background:var(--warn-bg);border:1px solid #F0DDB4;border-left:3px solid var(--warn);
  border-radius:var(--r);padding:10px 14px;margin-bottom:11px}
.review.show{display:flex}
.review .t{font-weight:700;font-size:13.5px;color:#8A5A0B}
.review .t small{display:block;font-weight:400;color:#9A7A45;font-size:12px;margin-top:1px}
.review .sp{flex:1}
.review .rbtn{border:1px solid #E0C88F;background:#fff;border-radius:var(--r-sm);padding:6px 13px;font-size:13px;color:#8A5A0B}
.review .rbtn:hover{border-color:var(--warn)}
.review .rbtn.pri{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.review .rbtn.pri:hover{background:#279152}
.card.auto{box-shadow:0 0 0 2px var(--warn)}
.card.auto .mark{background:linear-gradient(transparent,rgba(140,90,11,.9) 45%)}
.obj.auto>.obj-h{background:var(--warn-bg)}
.flyer{position:fixed;z-index:120;border-radius:6px;object-fit:cover;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.35);transition:transform .55s cubic-bezier(.4,0,.2,1),opacity .55s}
.wandov{position:fixed;inset:0;z-index:115;background:rgba(9,18,31,.42);display:grid;place-items:center}
.wbox{background:#fff;border-radius:10px;width:min(440px,92vw);padding:20px 22px 16px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.wh{font-size:17px;font-weight:700}
.wh small{display:block;font-weight:400;font-size:12.5px;color:var(--text-2);margin-top:2px}
.wbar{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden;margin:14px 0 12px}
.wbar i{display:block;height:100%;background:var(--violet);width:0;transition:width .08s linear}
.wrow{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);padding:3px 0}
.wrow b{color:var(--text);font-variant-numeric:tabular-nums}
.wfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}
.wnote{font-size:12px;color:var(--muted)}
.wsrc{font-size:13px;color:var(--text-2);line-height:1.45;margin-bottom:12px}
.wmodes{display:grid;gap:8px;margin-bottom:12px}
.wmode{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.wmode:has(input:checked){border-color:var(--blue);background:var(--blue-050);box-shadow:0 0 0 1px var(--blue)}
.wmode.dis{opacity:.5;cursor:default}
.wmode input{grid-row:1/4;margin:3px 0 0}
.wmode .wt{font-weight:700;font-size:13.5px}
.wmode .wd{font-size:12.5px;color:var(--text-2);line-height:1.4}
.wmode .wn{font-size:12px;color:var(--blue-600);font-weight:600;margin-top:2px}
.rchk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#8A5A0B;white-space:nowrap}
.wandbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:110;background:var(--navy-800);color:#fff;
  border-radius:10px;padding:11px 18px;font-size:13.5px;box-shadow:0 10px 34px rgba(10,22,38,.4);display:flex;align-items:center;gap:10px}
.card .zoom{position:absolute;top:5px;right:5px;width:27px;height:27px;border-radius:5px;
  background:rgba(14,30,51,.7);color:#fff;border:0;display:none;place-items:center;z-index:4;backdrop-filter:blur(2px)}
.card:hover .zoom{display:grid}
.card .zoom:hover{background:var(--blue)}
.card.voice .zoom{display:none}
.step.full{opacity:.6}
.step.full .step-h .nm::after{content:" · заполнен";color:var(--ok);font-weight:600;font-size:11px}
.it.bound{background:var(--ok-bg);border:1px solid #BFE3CD}
.it.bound .n{font-weight:600;color:#1D7444}
.it.bound .n small{color:#3E8A5E}
.it.bound .key.ok{background:var(--ok);color:#fff}
.it .unb{flex:none;border:1px solid #BFE3CD;background:#fff;border-radius:var(--r-sm);padding:3px 9px;font-size:12px;color:#1D7444}
.it .unb:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.it.newobj{background:var(--blue-050);border:1px dashed var(--blue-100)}
.it.newobj .key{background:var(--blue);color:#fff;font-size:13px}
.it.newobj .n{color:var(--blue-600);font-weight:600}
.it.setcur .n{color:var(--text-2)}
.it.full{opacity:.42;cursor:not-allowed}
.it.full:hover{background:transparent}
.it .n small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
.it{align-items:flex-start}
.it .key,.it .c{margin-top:1px}
.card .cap .vd{color:var(--danger);font-weight:700}
/* заметки — строки-разделители на всю ширину ленты */
.card.voice{grid-column:1/-1;background:#F6F3FC;border:1px solid #E1D8F3;border-left:3px solid #6949A8;
  border-radius:var(--r);cursor:default;display:flex;align-items:flex-start;gap:12px;padding:10px 13px;margin:5px 0;user-select:text}
.card.voice.note{background:#FDF7EA;border-color:#EFE1BE;border-left-color:var(--warn)}
.card.voice:hover{box-shadow:none;border-color:#E1D8F3}
.card.voice.note:hover{border-color:#EFE1BE}
.card.voice .pl{width:30px;height:30px;border-radius:50%;background:#6949A8;color:#fff;display:grid;place-items:center;flex:none;border:0;margin-top:1px}
.card.voice.note .pl{background:var(--warn)}
.card.voice .vb{flex:1;min-width:0}
.card.voice .vh{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-wrap:wrap}
.card.voice .vt{font-size:10.5px;font-weight:700;color:#6949A8;text-transform:uppercase;letter-spacing:.05em}
.card.voice.note .vt{color:#8A5A0B}
.card.voice .vm{font-size:11.5px;color:var(--muted)}
.card.voice .vx{font-size:13.5px;line-height:1.45;color:var(--text);user-select:text;cursor:text;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.voice.exp .vx{display:block;overflow:visible}
.card.voice .acts{flex:none;display:flex;gap:5px;align-items:center;align-self:flex-start}
.card.voice.exp .wv{display:flex}
.card.voice .wv{display:none}
#selact{position:fixed;z-index:130;display:none;align-items:center;gap:7px;background:var(--navy-800);color:#fff;
  border-radius:8px;padding:7px 9px;box-shadow:0 8px 26px rgba(10,22,38,.4);font-size:12.5px}
#selact.show{display:flex}
#selact b{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#CFE0F0}
#selact button{border:0;background:var(--blue);color:#fff;border-radius:var(--r-sm);padding:5px 10px;font-size:12.5px;font-weight:600}
#selact button:hover{background:#3E8AC9}
#selact button.alt{background:rgba(255,255,255,.14)}
#selact button.alt:hover{background:rgba(255,255,255,.26)}
.card.voice .wv{display:flex;align-items:flex-end;gap:2px;height:14px;opacity:.45;margin-top:6px}
.card.voice .wv i{width:2px;background:#6949A8;border-radius:2px}
.card.voice .copy{flex:none;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);
  padding:4px 9px;font-size:12px;color:var(--text-2);white-space:nowrap}
.card.voice .copy:hover{border-color:var(--blue-300);color:var(--blue-600)}
.marquee{position:fixed;border:1.5px solid var(--blue);background:rgba(51,122,183,.13);z-index:35;pointer-events:none;border-radius:2px}
body.marq{cursor:crosshair}
body.marq .card{cursor:crosshair}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:6px}

/* ---------- правая панель ---------- */
.right{background:var(--surface);border-left:1px solid var(--line)}
.rtabs{display:flex;border-bottom:1px solid var(--line);background:#F8FAFC}
.rtab{flex:1;border:0;background:transparent;padding:10px;font-size:13.5px;color:var(--text-2);border-bottom:2px solid transparent}
.rtab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;background:#fff}
.rbody{flex:1;overflow:auto;padding-bottom:120px}
.stage{border-bottom:1px solid var(--line-2)}
.stage-h{display:flex;align-items:center;gap:9px;padding:10px 13px;background:#F8FAFC;width:100%;border:0;text-align:left;border-bottom:1px solid var(--line-2)}
.stage-h{position:sticky;top:0;z-index:3;cursor:pointer}
.stage-h:hover{background:#F1F5FA}
.stage-h .car{opacity:.45;flex:none;transition:transform .15s}
.stage.closed .car{transform:rotate(-90deg)}
.stage.closed .stage-body{display:none}
.stage.closed .stage-h{border-bottom-color:var(--line)}
.stage-h .t{font-weight:700;font-size:13.5px;color:var(--navy-700);flex:1}
.stage-h .rep{background:var(--blue-050);color:var(--blue-600);border-radius:3px;font-size:10px;font-weight:700;padding:1px 6px;text-transform:uppercase;letter-spacing:.04em}
.stage-h .c{font-size:11.5px;color:var(--muted)}
.addrow{padding:7px 10px;border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:center;background:#fff}
.obj{border-bottom:1px solid var(--line-2)}
.obj-h{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;background:#fff}
.obj-h:hover{background:#F7FAFD}
.obj.cur>.obj-h{background:var(--blue-050);box-shadow:inset 3px 0 0 var(--blue)}
.obj-h .n{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj-h .n small{display:block;font-weight:400;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.obj-h .c{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.obj-h .curtag{background:var(--blue);color:#fff;border-radius:3px;font-size:9.5px;font-weight:700;padding:1px 5px;letter-spacing:.04em}
.obj-body{display:none;padding:4px 6px 8px;background:#FBFCFE}
.obj.open .obj-body{display:block}
.obj-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:2px 2px 8px;margin-bottom:6px;border-bottom:1px solid var(--line-2)}
.obj-acts-hint{font-size:11.5px;color:var(--muted);margin-left:4px}
.fp{margin:0 2px 8px;padding:8px 10px 6px;background:#F7F9FB;border:1px solid var(--line-2);border-radius:var(--r-sm);font-size:12.5px}
.fp-row{display:grid;grid-template-columns:minmax(96px,36%) 1fr;gap:8px;padding:2px 0;line-height:1.4}
.fp-l{color:var(--muted)}
.fp-v{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp.full .fp-v{white-space:normal}
.fp-row.miss .fp-v{color:var(--danger);font-weight:600}
.fp-src{font-style:normal;font-weight:400;font-size:10.5px;color:var(--muted);margin-left:6px}
.fp-row.def .fp-src{color:#B07A1E}
.fp-row.def .fp-v{font-weight:400}
.fp-g{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:9px 0 3px;display:flex;justify-content:space-between;align-items:center}
.fp-g:first-child{margin-top:0}
.fp-foot{display:flex;gap:12px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--line-2)}
.fp-af{font-size:11px;color:#8A5A0B;flex:1}
.lnk{border:0;background:none;color:var(--blue);font-size:12px;padding:0;cursor:pointer;font-family:inherit}
.lnk:hover{text-decoration:underline}
.lnk.dim{color:var(--muted)}
.step{border:1.5px dashed transparent;border-radius:var(--r-sm);padding:6px 8px;margin-bottom:2px}
.step:hover{background:#F2F7FC}
.step.hot{border-color:var(--blue);background:var(--blue-050)}
.step.hl{background:var(--blue-050);border-color:var(--blue-300)}
.obj.hl>.obj-h{box-shadow:inset 3px 0 0 var(--blue-300)}
.feed.linking .card:not(.linked):not(.voice){opacity:.32;transition:opacity .12s}
.feed.linking .card.linked{box-shadow:0 0 0 2px var(--blue);opacity:1}
.feed.linking .card.linked img{filter:none}
.step.found{animation:found 1.5s ease-out}
@keyframes found{
  0%{box-shadow:0 0 0 0 rgba(51,122,183,.55);background:var(--blue-100)}
  18%{box-shadow:0 0 0 4px rgba(51,122,183,.28);background:var(--blue-100)}
  100%{box-shadow:0 0 0 0 rgba(51,122,183,0);background:transparent}}
@media (prefers-reduced-motion:reduce){.step.found{animation:none;background:var(--blue-100)}}
.step.bad{border-color:var(--danger);background:var(--danger-bg)}
.step-h{display:flex;align-items:center;gap:8px}
.step .key.dim{opacity:.35;font-size:9px}
.step .key{width:17px;height:17px;border-radius:3px;background:#EDF1F6;color:var(--text-2);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}
.obj.cur .step .key.dim{opacity:.35;font-size:9px}
.step .key{background:var(--blue-100);color:var(--blue-600)}
.step .nm{flex:1;font-size:12.5px;font-weight:600;min-width:0}
.step .lim{display:flex;align-items:center;gap:6px;margin:4px 0 0 25px;font-size:11px;color:var(--text-2)}
.step .lim .need{font-weight:700;color:var(--navy-700)}
.step .lim .left{color:var(--warn);font-weight:700}
.step .lim .free{color:var(--muted)}
.step .hint{font-size:11.5px;color:var(--text-2);line-height:1.4;margin:3px 0 0 25px}
.slots{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;padding-left:25px;align-items:center}
.slot{width:36px;height:27px;border-radius:3px;border:1.5px dashed #C3D0DF;background:#F7FAFD}
.slot.req{border-color:#EBB9B7;background:#FDF4F4}
.slots .plus{font-size:10.5px;color:var(--muted);padding-left:2px}
.step .cnt{font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px;background:var(--line-2);color:var(--text-2);flex:none}
.step .cnt.ok{background:var(--ok-bg);color:var(--ok)}
.step .cnt.err{background:var(--danger-bg);color:var(--danger)}
.step .cnt.warn{background:var(--warn-bg);color:#8A5A0B}
.step .why{display:none;font-size:11px;color:var(--danger);font-weight:600;margin-top:4px}
.step.bad .why{display:block}
.thumbs{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px;padding-left:25px}
.th{width:36px;height:27px;border-radius:3px;overflow:hidden;border:1px solid var(--line);position:relative;cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.fromstep{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue-100)}
.th.fromstep .src{position:absolute;right:0;bottom:0;background:var(--blue);color:#fff;padding:1px 2px;border-radius:2px 0 0 0;display:grid}
.th.auto{border-color:var(--warn);box-shadow:0 0 0 1px #F0DDB4}
.th .rm{position:absolute;inset:0;background:rgba(217,83,79,.85);color:#fff;display:none;place-items:center}
.th:hover .rm{display:grid}
/* --- блокировки: проверенные шаги и закреплённые кадры --- */
.step.lock{background:#F4F6F9;border-color:transparent}
.step.lock:hover{background:#F4F6F9}
.step.lock .nm{color:var(--text-2)}
.step.lock .key{background:#E4E9EF;color:#93A2B2}
.step.lock .cnt,.step.lock .cnt.ok,.step.lock .cnt.warn{background:#E4E9EF;color:#6B7B8C}
.step.redo{border-color:#E7C77A;background:#FDF8EC}
.lockrow{display:flex;align-items:center;gap:5px;margin:4px 0 0 25px;font-size:11px;font-weight:700;line-height:1.35}
.lockrow.frz{color:#7B8A9A}
.lockrow.redo{color:#8A5A0B}
.lockrow svg{flex:none}
.lockrow span{font-weight:400}
.step .lim .was{color:var(--muted)}
.th.lk{border-color:#AAB8C6;box-shadow:0 0 0 1px #E4E9EF}
.th.lk .lk{position:absolute;right:0;bottom:0;background:#7B8A9A;color:#fff;padding:1px 2px;border-radius:2px 0 0 0;display:grid}
.th.rej{border-color:var(--danger)}
.th.rej img{filter:grayscale(1);opacity:.6}
.th.rej::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:1.5px;background:var(--danger);transform:rotate(-34deg)}
.obj.lock>.obj-h .n{color:var(--text-2)}
.pillx.lock{background:#E9EDF2;color:#6B7B8C;display:inline-flex;align-items:center;gap:4px;padding:2px 8px}
.it.lock{opacity:.45;cursor:not-allowed}
.it.lock:hover{background:transparent}
.mark.lk{background:linear-gradient(transparent,rgba(60,74,90,.94) 45%)}
.mark.rej{background:linear-gradient(transparent,rgba(150,50,46,.94) 45%)}
.mark .lk{margin-left:auto;flex:none;display:grid;opacity:.85}
.bar{position:relative}
.bar u{position:absolute;left:0;top:0;height:100%;background:#93A6BA;z-index:2;transition:width .25s}
.stat .sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.25}
.stat .sub:empty{display:none}
.scen{display:flex;gap:6px;align-items:center;margin-top:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.scen button{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:5px 10px;font-size:12.5px;color:var(--text-2)}
.scen button:hover{border-color:var(--blue-300)}
.scen button.on{border-color:var(--blue);background:var(--blue-050);color:var(--blue-600);font-weight:600}
.req{color:var(--danger);font-weight:700}
.hintbox{font-size:12.5px;color:var(--muted);padding:12px 14px}

/* ведомость */
.srow{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer}
.srow:hover{background:#F7FAFD}
.srow .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--danger)}
.srow.found .dot{background:var(--ok)}
.srow.extra .dot{background:var(--warn)}
.srow .inv{font-weight:700;font-variant-numeric:tabular-nums;min-width:60px}
.srow .nm{flex:1;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gform{padding:4px 12px 12px}
.grow{margin-bottom:9px}
.grow label{display:block;font-size:12px;color:var(--text-2);margin-bottom:3px}
.grow input,.grow select{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px;font:inherit;font-size:13px;outline:none}
.grow input:focus,.grow select:focus{border-color:var(--blue-300)}
.grow .cmp{font-size:11.5px;color:var(--muted);margin-top:4px}
.sheet-tools{padding:9px 12px;border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pillx{border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700}
.pillx.ok{background:var(--ok-bg);color:var(--ok)}
.pillx.warn{background:var(--warn-bg);color:#8A5A0B}
.pillx.err{background:var(--danger-bg);color:var(--danger)}

/* панель выделения */
.selbar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,150%);z-index:40;background:var(--navy-800);color:#fff;
  border-radius:10px;box-shadow:0 10px 34px rgba(10,22,38,.4);display:flex;align-items:center;gap:8px;padding:9px 10px 9px 16px;
  transition:transform .2s cubic-bezier(.2,.8,.3,1)}
.selbar.show{transform:translate(-50%,0)}
.selbar .n{font-weight:700;font-size:14px;margin-right:6px;white-space:nowrap}
.selbar .n small{display:block;font-weight:400;font-size:11px;color:#93A7BF}
.sbtn{background:rgba(255,255,255,.1);border:0;color:#E4ECF5;border-radius:var(--r-sm);padding:7px 12px;font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.sbtn:hover{background:rgba(255,255,255,.2);color:#fff}
.sbtn.primary{background:var(--blue);color:#fff;font-weight:600}
.sbtn.primary:hover{background:#3E8AC9}
.selbar .div{width:1px;height:22px;background:rgba(255,255,255,.16);margin:0 2px}

.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(16,32,50,.24);
  width:360px;max-height:62vh;display:none;flex-direction:column;overflow:hidden}
.pop.show{display:flex}
.pop .list{overflow:auto;padding:5px}
.schtools{display:flex;gap:6px 8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line-2);background:#fff;position:sticky;top:0;z-index:5}
.schtools .lbtn{white-space:nowrap}
.lg{border-bottom:1px solid var(--line-2)}
.lgh{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#F6F8FB;padding:8px 10px;text-align:left;
  font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;position:sticky;top:0;z-index:2}
.lgh:hover{background:#EDF2F8}
.lgh .car{opacity:.45;flex:none;transition:transform .15s}
.lgh .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgh .c{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.lg.closed .car{transform:rotate(-90deg)}
.lg.closed .lgb{display:none}
.lgb{padding:4px}
.gl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 9px 4px;font-weight:700}
.it{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;font-size:13.5px}
.it:hover{background:var(--blue-050)}
.it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .c{font-size:11.5px;color:var(--muted);flex:none}
.it .key{width:17px;height:17px;border-radius:3px;background:#EDF1F6;color:var(--text-2);font-size:10.5px;font-weight:700;display:grid;place-items:center;flex:none}

/* модалка */
.modal{position:fixed;inset:0;z-index:90;background:rgba(9,18,31,.55);display:none;place-items:center;padding:20px}
.modal.show{display:grid}
.mbox{background:#fff;border-radius:10px;width:min(600px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.mbox h3{margin:0;padding:18px 22px 4px;font-size:19px}
.mbox .sub{padding:0 22px;color:var(--text-2);font-size:13px}
.mbox .body{padding:14px 22px 6px}
.mbox .foot{padding:14px 22px 18px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line-2);margin-top:14px}
.f-row{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.f-row label{font-size:13px;color:var(--text-2)}
.f-row input,.f-row select{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font:inherit;font-size:13.5px;outline:none;width:100%}
.f-row input:focus,.f-row select:focus{border-color:var(--blue-300)}
.f-row select{background:#fff}
.fgrp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--line-2)}
.fgrp:first-child{margin-top:0;padding-top:0;border-top:0}
.ocrhint{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.ocrhint button{border:1px solid var(--blue-100);background:var(--blue-050);color:var(--blue-600);border-radius:20px;padding:3px 10px;font-size:12px}
.mbtn{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:8px 16px;font-size:13.5px}
.mbtn:hover{border-color:var(--blue-300)}
.mbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.mbtn.primary:hover{background:var(--blue-600)}
.sum{padding:11px 13px;border-radius:var(--r);margin-bottom:9px;font-size:13.5px}

.sum.warn{background:var(--warn-bg);color:#8A5A0B}
.sum.err{background:var(--danger-bg);color:#96322E}

.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;border-radius:4px;background:#F1F5F9;border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--text-2)}

.toasts{position:fixed;left:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-800);color:#fff;border-radius:8px;padding:11px 13px;font-size:13px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 26px rgba(10,22,38,.34)}
.toast.err{background:#8E332F}
.toast button{background:transparent;border:0;color:#8FC0EC;font-weight:700;text-decoration:underline}

.lb{position:fixed;inset:0;z-index:80;background:rgba(9,18,31,.95);display:none;grid-template-columns:1fr 340px}
.lb.show{display:grid}
.lb-main{position:relative;display:grid;place-items:center;padding:56px 20px 20px;min-width:0}
.lb-stage{display:flex;flex-direction:column;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:8px}
.lb-main img{width:min(62vw,900px);height:auto;max-height:72vh;object-fit:contain;border-radius:8px 8px 0 0;background:#22303F;display:block}
.lb-stage.on{box-shadow:0 0 0 3px var(--ok),0 20px 60px rgba(0,0,0,.5)}
.lb-bind{width:min(62vw,900px);display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:0 0 8px 8px;font-size:13.5px}
.lb-bind.on{background:#1E6E43;color:#fff;transition:background .18s}

  background:rgba(255,255,255,.22);border-radius:20px;padding:3px 10px;margin-right:2px}

.note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line-2)}
.ghost{position:fixed;top:-1000px;left:-1000px;background:var(--navy-800);color:#fff;border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600}
</style></head>

const REVIEW={};

function assign(ids,owner,stepId,silent){
  const stage=ownerStage(owner); if(!stage) return false;
  const st=stage.steps.find(s=>s.id===stepId); if(!st) return false;
  if(isFrozen(owner,stepId)){toast(`«${st.n}» проверен и закрыт — добавить нельзя`,'err');return false}
  const wrong=ids.map(i=>frameByI[i]).find(f=>(st.kind==='Видео')!==(f.type==='video'));
  if(wrong){toast(st.kind==='Видео'?'Шаг принимает только видео':'Шаг принимает только фото','err');return false}
  const add=ids.filter(i=>!(frameByI[i].objId===owner&&frameByI[i].stepId===stepId)).length;
  if(st.max&&cnt(owner,stepId)+add>st.max){toast(`«${st.n}» принимает не больше ${st.max}`,'err');return false}
  state.undo.push(ids.map(i=>({i,o:frameByI[i].objId,s:frameByI[i].stepId})));
  ids.forEach(i=>{frameByI[i].objId=owner;frameByI[i].stepId=stepId});
  markSaving();render();
  if(!silent){const label=O(owner)?objName(O(owner)):stage.title;
    toast(`${plural(ids.length,'кадр','кадра','кадров')} → «${st.n}» · ${label}`,'ok',undoLast)}
  return true;
}
function unassign(ids){
  const blocked=ids.map(i=>frameByI[i]).find(f=>f.lock||f.rej);
  if(blocked){toast(frameWhy(blocked)+' — открепить нельзя','err');return}
  const t=ids.filter(i=>frameByI[i].objId);if(!t.length){toast('Выбранное и так не распределено');return}
  state.undo.push(t.map(i=>({i,o:frameByI[i].objId,s:frameByI[i].stepId})));
  t.forEach(i=>{frameByI[i].objId=null;frameByI[i].stepId=null});
  markSaving();render();toast(`Откреплено ${plural(t.length,'кадр','кадра','кадров')}`,'ok',undoLast);
}
function undoLast(){const p=state.undo.pop();if(!p){toast('Нечего отменять');return}
  p.forEach(x=>{frameByI[x.i].objId=x.o;frameByI[x.i].stepId=x.s});markSaving();render();toast('Действие отменено')}
function createObject(stageId,form){
  const o={id:'o'+(++objSeq),stageId,form:{...form}};objects.push(o);
  state.cur=o.id;state.open.add(o.id);return o;
}
function deleteObject(id){
  frames.forEach(f=>{if(f.objId===id){f.objId=null;f.stepId=null}});
  objects.splice(objects.findIndex(o=>o.id===id),1);
  if(state.cur===id)state.cur=objects.length?objects[objects.length-1].id:null;
  markSaving();render();
}

            шаги с решением «Ок» заморожены, по одному вынесено «Повторить»,
            и один объект был разложен из свободной съёмки в прошлый заход */
const SCEN=['empty','mixed','review'];

function resetScenario(){
  Object.keys(REVIEW).forEach(k=>delete REVIEW[k]);
  frames.forEach(f=>{f.origin='free';f.objId=null;f.stepId=null;f.lock=false;f.rej=false;delete f.auto});
  objects.length=0; objSeq=0;
  state.cur=null; state.sel.clear(); state.open.clear(); state.undo.length=0; state.onlyOpen=false;
}
function applyScenario(name){
  scen=name; resetScenario();
  if(name==='empty'){render();return}
  const bld=createObject('bld',{no:'ЦЕХ-6',purpose:'Производственный цех',cond:'Удовлетворительное',heat:'Отапливается',access:'Да'});
  bld.fromInspection=true;
  PREFILL.forEach(x=>{
    const f=frameByI[x.i]; if(!f) return;
    f.origin='step'; f.lock=true; f.objId=x.obj?bld.id:x.owner; f.stepId=x.step;
  });
  state.open.delete(bld.id);
  if(name==='review'){
    const eq=createObject('eq',{mark:'Пропиточная линия POLYPRISE',sn:'',inv:'10798',shop:'',
      cond:'Рабочее',mount:'Установлено',use:'Эксплуатируется',def:'Не выявлены',bld:'ЦЕХ-6'});
    eq.fromInspection=true;
    PREV.forEach(x=>{const f=frameByI[x.i];if(!f)return;f.objId=eq.id;f.stepId=x.step;f.lock=true});
    state.open.delete(eq.id);
    const OK=(o,s)=>REVIEW[rk(o,s)]={v:'ok',at:'20 июня',by:'Проверяющий'};
    OK('gen','g1'); OK('gen','g3'); OK('gen','g4');
    OK(bld.id,'b1'); OK(bld.id,'b2');
    OK(eq.id,'e1'); OK(eq.id,'e2');
    /* «Повторить»: кадры общего вида отклонены, место в шаге освободилось */
    REVIEW[rk(eq.id,'e3')]={v:'redo',at:'20 июня',by:'Проверяющий',
      note:'Станок снят в тени, деталей не видно — переснять'};
    framesIn(eq.id,'e3').forEach(f=>f.rej=true);
  }
  state.cur=null;
  render();
}

function autoPlan(){

function planPhotosOnly(){
  const {objs,loose,skipped}=autoPlan();
  const place=[],nomatch=[],cap={};
  const room=(owner,st)=>{const k=owner+'|'+st.id;if(!(k in cap))cap[k]=st.max?st.max-cnt(owner,st.id):Infinity;return cap[k]};
  objs.forEach(b=>{
    const same=x=>x.stageId===b.stageId;
    const o=b.stageId==='eq'
      ?(b.form.inv&&objects.find(x=>same(x)&&x.form.inv===b.form.inv))||objects.find(x=>same(x)&&!x.form.inv&&x.form.mark===b.form.mark)
      :objects.find(x=>same(x)&&x.form.no===b.form.no);
    if(!o){nomatch.push(...b.frames.map(f=>f.i));return}
    b.frames.forEach(f=>{
      const st=stageById[o.stageId].steps.find(x=>x.id===f.stepId);
      if(isFrozen(o.id,f.stepId)||room(o.id,st)<=0){skipped.push(f.i);return}
      cap[o.id+'|'+st.id]--; place.push({i:f.i,owner:o.id,stepId:f.stepId});
    });
  });

let wandTimer=null;
function runWand(mode){

  const notes=frames.filter(f=>!isMedia(f)).length;
  const frameIds=mode==='full'?[...plan.loose.map(x=>x.i),...plan.objs.flatMap(o=>o.frames.map(f=>f.i))]
    :mode==='photos'?po.place.map(x=>x.i):[];
  const objN=mode==='photos'?objects.length:plan.objs.length;
  const total=mode==='struct'?objN:frameIds.length;
  const ov=document.createElement('div');ov.className='wandov';ov.id='wandov';
  ov.innerHTML=`<div class="wbox">
    <div class="wh">Автораспределение<small>режим: ${MODE_T[mode]}</small></div>
    <div class="wbar"><i id="wProg"></i></div>
    <div class="wrow"><span>${mode==='struct'?'Объектов создано':'Кадров обработано'}</span><b id="wA">0 / ${total}</b></div>
    <div class="wrow"><span>Заметок прочитано</span><b id="wB">0 / ${notes}</b></div>
    ${mode!=='struct'?`<div class="wrow"><span>${mode==='photos'?'Объектов сопоставлено':'Объектов создано'}</span><b id="wC">0 / ${objN}</b></div>`:''}
    <div class="wfoot"><span class="wnote">Структура заблокирована до конца обработки</span><button class="lbtn" id="wStop">Прервать</button></div></div>`;
  document.body.appendChild(ov);
  const dur=Math.min(4600,1500+total*16), t0=performance.now();
  $('#wStop').onclick=()=>{clearInterval(wandTimer);ov.remove();$$('.flyer').forEach(x=>x.remove());
    toast('Автораспределение прервано — ничего не применено')};
  if(frameIds.length)animateFly(frameIds,()=>{},null);
  wandTimer=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/dur);
    $('#wProg').style.width=(k*100)+'%';
    $('#wA').textContent=`${Math.round(total*k)} / ${total}`;
    $('#wB').textContent=`${Math.round(notes*Math.min(1,k*1.7))} / ${notes}`;
    const c=$('#wC');if(c)c.textContent=`${Math.round(objN*Math.min(1,k*1.25))} / ${objN}`;

function animateFly(ids,done,bar){
  const panel=$('#rbody').getBoundingClientRect();
  const vis=ids.map(i=>document.querySelector(`.card[data-i="${i}"]`)).filter(el=>{
    if(!el)return false;const r=el.getBoundingClientRect();return r.bottom>60&&r.top<innerHeight-60;
  }).slice(0,14);
  const n=$('#wandN');
  if(!vis.length){if(n)n.textContent=`${ids.length} / ${ids.length}`;setTimeout(done,420);return}
  let left=vis.length,shown=0;
  vis.forEach((el,k)=>setTimeout(()=>{
    const img=el.querySelector('img');
    if(!img){if(--left===0)setTimeout(done,300);return}
    const r=img.getBoundingClientRect();
    const c=img.cloneNode();c.className='flyer';
    Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
    document.body.appendChild(c);
    requestAnimationFrame(()=>{
      const tx=panel.left+panel.width/2-(r.left+r.width/2);
      const ty=panel.top+130-(r.top+r.height/2);
      c.style.transform=`translate(${tx}px,${ty}px) scale(.12) rotate(7deg)`;
      c.style.opacity='0';
    });
    setTimeout(()=>{
      c.remove();shown++;
      if(n)n.textContent=`${Math.round(ids.length*shown/vis.length)} / ${ids.length}`;
      if(--left===0)setTimeout(done,280);
    },580);

function applyWand(mode,plan,po){
  let nObj=0,nFr=0,nomatch=0;
  if(mode!=='photos'){
    plan.objs.forEach(o=>{
      const ob=createObject(o.stageId,o.form);ob.auto=true;
      const REC=new Set(['mark','inv','shop','no']);   // распознано на кадрах или в заметках
      ob.autoSrc={};Object.keys(o.form).forEach(k=>{if(o.form[k])ob.autoSrc[k]=REC.has(k)?'rec':'def'});
      nObj++;
      if(mode==='full')o.frames.forEach(x=>{const f=frameByI[x.i];f.objId=ob.id;f.stepId=x.stepId;f.auto=true;nFr++});
    });
    if(mode==='full')plan.loose.forEach(x=>{const f=frameByI[x.i];f.objId=x.owner;f.stepId=x.stepId;f.auto=true;nFr++});

  state.cur=null;state.review=true;state.reviewOnly=true;
  state.reviewTotal=objects.filter(o=>o.auto).length;

function acceptObj(id){const o=O(id);if(!o)return;delete o.auto;delete o.autoSrc;
  frames.forEach(f=>{if(f.objId===id)delete f.auto});
  state.open.delete(id);
  const next=objects.find(x=>x.auto);
  if(next){state.cur=next.id;state.open.add(next.id)}else state.cur=null;
  if(!objects.some(x=>x.auto)&&!frames.some(f=>f.auto)){state.review=false;toast('Все объекты проверены')}

  if(next)revealObj(next.id);
}
function rejectObj(id){
  frames.forEach(f=>{if(f.objId===id){f.objId=null;f.stepId=null;delete f.auto}});
  const i=objects.findIndex(o=>o.id===id);if(i>=0)objects.splice(i,1);
  const next=objects.find(x=>x.auto);
  if(next){state.cur=next.id;state.open.add(next.id)}else if(state.cur===id)state.cur=null;
  if(!objects.some(x=>x.auto)&&!frames.some(f=>f.auto))state.review=false;
  markSaving();render();
  if(next)revealObj(next.id);
}

/* ========================= ПАНЕЛЬ СХЕМЫ ========================= */
function needText(st){
  if(st.max===1&&st.min===1)return'нужно ровно 1';
  if(st.min&&st.max)return`нужно от ${st.min} до ${st.max}`;
  if(st.min&&!st.max)return`нужно не меньше ${st.min}`;
  if(!st.min&&st.max)return`можно до ${st.max}`;
  return'по факту, если есть';
}
const chipText=(st,n)=>st.max?`${n} / ${st.max}`:(st.min?`${n} / от ${st.min}`:`${n}`);
const stepFull=(owner,st)=>!!(st.max&&cnt(owner,st.id)>=st.max);
function stepHTML(owner,st,i,showKey){
  const n=cnt(owner,st.id), s=stepState(owner,st);
  const frz=isFrozen(owner,st.id), vd=verdict(owner,st.id), redo=!!(vd&&vd.v==='redo');
  const was=wasCnt(owner,st.id);
  const th=framesIn(owner,st.id).slice(0,8).map(f=>{
    const cls=f.rej?'rej':(f.origin==='step'?'fromstep':(f.lock?'lk':''));
    const badge=f.rej?''
      :f.origin==='step'?`<span class="src">${SVG_CAM}</span>`
      :f.lock?`<span class="lk">${SVG_LOCK}</span>`
      :`<span class="rm" data-act="rmf">${SVG_X}</span>`;
    const tip=f.rej?'Отклонён проверяющим — остаётся в истории шага'
      :f.origin==='step'?'Снято в шаге при обычном осмотре — изменить нельзя'
      :f.lock?'Привязано до вас и проверено — изменить нельзя':'Из свободной съёмки';
    return `<span class="th ${cls}${f.auto?' auto':''}" data-i="${f.i}" title="${tip}">
      <img src="data:image/jpeg;base64,${f.src}" alt="">${badge}</span>`}).join('');
  const missing=frz?0:Math.max(0,st.min-n);
  const slots=Array.from({length:Math.min(missing,8)},()=>`<span class="slot${st.req?' req':''}"></span>`).join('');
  const canMore=st.max?Math.max(0,st.max-n):null;
  let tail='';
  if(frz)tail='';
  else if(missing)tail=`<span class="left">не хватает ${missing}</span>`;
  else if(n&&canMore)tail=`<span class="free">можно ещё ${canMore}</span>`;
  else if(n&&canMore===null)tail=`<span class="free">минимум набран</span>`;
  if(!frz&&was&&was<n)tail+=`<span class="was">· ${was} из них было до вас</span>`;
  const full=stepFull(owner,st);
  const lockrow=frz
    ? `<div class="lockrow frz" title="${esc(freezeWhy(owner,st.id))}">${SVG_LOCK}Проверен и закрыт ${esc(vd.at)}<span> · содержимое изменить нельзя</span></div>`
    : redo
    ? `<div class="lockrow redo">${SVG_REDO}«Повторить» от ${esc(vd.at)}<span> · ${esc(vd.note||'нужно переснять')}</span></div>`
    : '';
  return `<div class="step ${s==='over'?'bad':''}${full&&!frz?' full':''}${frz?' lock':''}${redo?' redo':''}" data-owner="${owner}" data-step="${st.id}" ${full&&!frz?'data-full="1"':''}${frz?' data-lock="1"':''}>
    <div class="step-h">${showKey&&!frz?`<span class="key">${i}</span>`:'<span class="key dim">·</span>'}
      <span class="nm">${esc(st.n)}${st.req?' <span class="req">*</span>':''}</span>
      <span class="cnt ${s==='over'?'err':s}">${chipText(st,n)}</span></div>
    ${frz?'':`<div class="lim"><span class="need">${st.kind} · ${needText(st)}</span>${tail}</div>`}
    ${lockrow}
    ${st.hint&&!frz?`<div class="hint">${esc(st.hint)}</div>`:''}
    ${th?`<div class="thumbs">${th}</div>`:''}
    ${slots?`<div class="slots">${slots}</div>`:''}
    <div class="why"></div></div>`;
}
/* Компактная форма: ключевые поля видны сразу, полная — по клику, редактирование — в модалке.
   Нужна, чтобы 40 объектов можно было проверить одним скроллом, не открывая 40 попапов. */
function formPreview(o){
  const st=stageById[o.stageId], full=state.formOpen.has(o.id);
  const vis=f=>!(f.dep&&o.form[f.dep.k]!==f.dep.v);
  const fields=st.form.filter(vis);
  const key=fields.filter(f=>o.form[f.k]||f.req).slice(0,6);
  const src=o.auto&&o.autoSrc?o.autoSrc:{};
  const SRC_T={rec:'распознано',def:'по умолчанию'};
  const row=f=>`<div class="fp-row${f.req&&!o.form[f.k]?' miss':''}${src[f.k]?' '+src[f.k]:''}">
    <span class="fp-l">${esc(f.l)}</span><span class="fp-v">${esc(o.form[f.k]||(f.req?'не заполнено':'—'))}${src[f.k]?`<i class="fp-src">${SRC_T[src[f.k]]}</i>`:''}</span></div>`;
  let html='';
  if(full){let g='';
    fields.forEach(f=>{
      if(f.grp&&f.grp!==g){g=f.grp;html+=`<div class="fp-g"><span>${esc(g)}</span><button class="lnk" data-act="edit" data-obj="${o.id}" data-grp="${esc(g)}">Изменить</button></div>`}
      html+=row(f)});
  } else html=key.map(row).join('');
  const lk=objLocked(o.id);
  return `<div class="fp${full?' full':''}">${html}
    <div class="fp-foot">
      ${o.auto?`<span class="fp-af">«по умолчанию» — не с кадра, проверьте</span>`:'<span class="fp-af"></span>'}
      <button class="lnk" data-act="fp" data-obj="${o.id}">${full?'Свернуть':`Все поля (${fields.length})`}</button>
      <button class="lnk" data-act="edit" data-obj="${o.id}">Изменить</button>
      ${lk||o.auto?'':`<button class="lnk dim" data-act="del" data-obj="${o.id}">Удалить</button>`}
    </div></div>`;
}
function objHTML(o){
  const st=stageById[o.stageId], open=state.open.has(o.id), cur=state.cur===o.id;
  const total=frames.filter(f=>f.objId===o.id).length;

  const lk=objLocked(o.id);
  const nfrz=st.steps.filter(x=>isFrozen(o.id,x.id)).length;
  const pairs=st.steps.map((x,k)=>[x,k]).filter(([x])=>!state.onlyOpen||!isFrozen(o.id,x.id));
  return `<div class="obj${cur?' cur':''}${open?' open':''}${o.auto?' auto':''}${lk?' lock':''}" data-obj="${o.id}">

      ${lk?`<span class="pillx lock" title="Проверено 20 июня — ${nfrz} из ${st.steps.length} шагов заморожено">${SVG_LOCK}${nfrz} проверено</span>`:''}
      ${cur?'<span class="curtag">текущий</span>':''}

}

      <div class="stage-body">${body}</div></div>`;
  }).join('');
}

/* Быстрый поиск шага: раскрывает схему до нужного шага и подсвечивает его.
   Нужен, когда повторов много и по метке на кадре непонятно, в какой именно объект он лёг. */
function locateFrame(i){
  const f=frameByI[i];
  if(!f||!f.objId){toast('Кадр не распределён');return}
  const o=O(f.objId), stageId=o?o.stageId:f.objId;
  state.closed.delete(stageId);
  if(o){state.cur=o.id;state.open.add(o.id)}
  if(state.onlyOpen&&isFrozen(f.objId,f.stepId))state.onlyOpen=false;   // иначе шаг спрятан фильтром
  if(state.rtab!=='scheme'){state.rtab='scheme';
    $$('.rtab').forEach(x=>x.classList.toggle('on',x.dataset.r==='scheme'))}
  render();
  const el=$(`.step[data-owner="${f.objId}"][data-step="${f.stepId}"]`);
  if(!el){toast('Шаг не найден в структуре','err');return}
  el.scrollIntoView({block:'center',behavior:'smooth'});
  el.classList.add('found'); setTimeout(()=>el.classList.remove('found'),1600);
  const th=el.querySelector(`.th[data-i="${i}"]`);
  if(th){th.style.outline='2px solid var(--blue)';setTimeout(()=>th.style.outline='',1600)}
}

function selectRange(to){const l=visibleMedia().map(f=>f.i),a=l.indexOf(state.last),b=l.indexOf(to);
  if(a<0||b<0){state.sel.add(to);return}
  const[s,e]=a<b?[a,b]:[b,a];for(let k=s;k<=e;k++)state.sel.add(l[k])}

/* Связь в обе стороны. Наведение подсвечивает, если цель уже в видимой области;
   прокрутка — только по клику, иначе правая часть будет дёргаться от каждого движения мыши. */
let hoverStep=null;
$('#feed').addEventListener('mouseover',e=>{
  const card=e.target.closest('.card');
  const f=card?frameByI[+card.dataset.i]:null;
  const key=f&&f.objId?f.objId+'|'+f.stepId:null;
  if(key===hoverStep)return;
  if(hoverStep){$$('.step.hl,.obj.hl').forEach(x=>x.classList.remove('hl'))}
  hoverStep=key; if(!key)return;
  const el=$(`.step[data-owner="${f.objId}"][data-step="${f.stepId}"]`);
  if(!el)return;
  const r=el.getBoundingClientRect(), rb=$('#rbody').getBoundingClientRect();
  if(r.bottom>rb.top&&r.top<rb.bottom){el.classList.add('hl');const ob=el.closest('.obj');if(ob)ob.classList.add('hl')}
});
$('#feed').addEventListener('mouseleave',()=>{hoverStep=null;$$('.step.hl,.obj.hl').forEach(x=>x.classList.remove('hl'))});
/* hover: шаг или объект → все его кадры в ленте */
let hoverKey=null;
$('#rbody').addEventListener('mouseover',e=>{
  const st=e.target.closest('.step'), oh=e.target.closest('.obj-h');
  const key=st?'s:'+st.dataset.owner+'|'+st.dataset.step:(oh?'o:'+oh.parentElement.dataset.obj:null);
  if(key===hoverKey)return;
  hoverKey=key;
  const feed=$('#feed');
  $$('.card.linked',feed).forEach(c=>c.classList.remove('linked'));
  if(!key){feed.classList.remove('linking');return}
  const ids=new Set(frames.filter(f=>st?(f.objId===st.dataset.owner&&f.stepId===st.dataset.step):(f.objId===key.slice(2))).map(f=>f.i));
  if(!ids.size){feed.classList.remove('linking');return}
  feed.classList.add('linking');
  $$('.card',feed).forEach(c=>{if(ids.has(+c.dataset.i))c.classList.add('linked')});

/* ---- выделение рамкой ---- */
let marq=false;
(function(){
  const feed=$('#feed'); let box=null,sx=0,sy=0,base=null,moved=false;
  feed.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const onCard=e.target.closest('.card');
    if(onCard&&!e.altKey)return;            // на карточке — обычный клик и перетаскивание
    marq=true;moved=false;
    base=(e.shiftKey||e.metaKey||e.ctrlKey)?new Set(state.sel):new Set();
    sx=e.clientX;sy=e.clientY;
    box=document.createElement('div');box.className='marquee';document.body.appendChild(box);
    document.body.classList.add('marq');
    e.preventDefault();
  });
  addEventListener('mousemove',e=>{
    if(!marq)return;
    if(Math.abs(e.clientX-sx)>3||Math.abs(e.clientY-sy)>3)moved=true;
    const x=Math.min(sx,e.clientX),y=Math.min(sy,e.clientY),w=Math.abs(e.clientX-sx),h=Math.abs(e.clientY-sy);
    Object.assign(box.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
    const sel=new Set(base);
    $$('.card:not(.voice)',feed).forEach(c=>{
      const b=c.getBoundingClientRect();
      if(b.right>x&&b.left<x+w&&b.bottom>y&&b.top<y+h)sel.add(+c.dataset.i);
    });
    state.sel=sel;
    $$('.card',feed).forEach(c=>c.classList.toggle('sel',state.sel.has(+c.dataset.i)));
    renderSelbar();
    const fr=feed.getBoundingClientRect();
    if(e.clientY-fr.top<60)feed.scrollTop-=14;else if(fr.bottom-e.clientY<60)feed.scrollTop+=14;
  });
  addEventListener('mouseup',()=>{
    if(!marq)return;marq=false;document.body.classList.remove('marq');
    if(box){box.remove();box=null}
    if(!moved&&!state.sel.size){renderFeed()}else{renderFeed();renderSelbar()}
  });
})();

/* ---- выделение текста в заметке → новый объект ---- */
(function(){
  const box=$('#selact');
  const hide=()=>box.classList.remove('show');
  document.addEventListener('mouseup',()=>{
    setTimeout(()=>{
      if(marq)return hide();
      const sel=window.getSelection();
      if(!sel||sel.isCollapsed)return hide();
      const node=sel.anchorNode;if(!node)return hide();
      const host=(node.nodeType===1?node:node.parentElement);
      if(!host||!host.closest('.card.voice'))return hide();
      const t=sel.toString().trim();
      if(t.length<2||t.length>120)return hide();
      const r=sel.getRangeAt(0).getBoundingClientRect();
      $('#selactTxt').textContent='«'+t+'»';
      box.dataset.text=t;box.classList.add('show');
      box.style.left=Math.max(10,Math.min(r.left,innerWidth-box.offsetWidth-10))+'px';
      box.style.top=Math.max(10,r.top-box.offsetHeight-8)+'px';
    },10);
  });
  document.addEventListener('scroll',hide,true);
  box.onclick=e=>{const b=e.target.closest('[data-st]');if(!b)return;
    const t=box.dataset.text;hide();window.getSelection().removeAllRanges();
    openObjForm(b.dataset.st,null,[],t)};
})();

/* ========================= DRAG & DROP ========================= */
let drag=[];
$('#feed').addEventListener('dragstart',e=>{
  if(marq){e.preventDefault();return}
  const c=e.target.closest('.card');if(!c||c.classList.contains('voice'))return;
  const i=+c.dataset.i;drag=state.sel.has(i)?[...state.sel]:[i];
  if(!state.sel.has(i)){state.sel.clear();state.sel.add(i);renderSelbar()}
  $$('.card').forEach(x=>{if(drag.includes(+x.dataset.i))x.classList.add('dragging')});
  const g=$('#ghost');g.textContent=drag.length>1?plural(drag.length,'кадр','кадра','кадров'):frameByI[i].n;
  e.dataTransfer.setDragImage(g,10,10);e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',drag.join(','));
});
document.addEventListener('dragend',()=>{drag=[];$$('.card.dragging').forEach(c=>c.classList.remove('dragging'));
  $$('.step.hot').forEach(s=>s.classList.remove('hot'))});
const rbody=$('#rbody');
rbody.addEventListener('dragover',e=>{
  if(!drag.length)return;e.preventDefault();
  const r=rbody.getBoundingClientRect();
  if(e.clientY-r.top<60)rbody.scrollTop-=14;else if(r.bottom-e.clientY<60)rbody.scrollTop+=14;
  const st=e.target.closest('.step');
  $$('.step.hot').forEach(s=>{if(s!==st)s.classList.remove('hot')});
  if(st&&!st.dataset.full&&!st.dataset.lock)st.classList.add('hot');
  e.dataTransfer.dropEffect=(st&&(st.dataset.full||st.dataset.lock))?'none':'move';
});
rbody.addEventListener('drop',e=>{
  const st=e.target.closest('.step');if(!st||!drag.length)return;e.preventDefault();
  if(st.dataset.lock){toast('Шаг проверен и закрыт — добавить нельзя','err');drag=[];return}
  if(st.dataset.full){toast('Шаг уже заполнен','err');drag=[];return}
  if(assign([...drag],st.dataset.owner,st.dataset.step))state.sel.clear();
  drag=[];renderSelbar();
});

  if(del){const o=O(del.dataset.obj);

  const fp=e.target.closest('[data-act="fp"]');

  const ed=e.target.closest('[data-act="edit"]');
  if(ed){const o=O(ed.dataset.obj);openObjForm(o.stageId,o.id);

  const rm=e.target.closest('[data-act="rmf"]');
  if(rm){const fi=+rm.closest('.th').dataset.i;
    if(frameByI[fi].lock||frameByI[fi].rej){toast(frameWhy(frameByI[fi])+' — открепить нельзя','err');return}
    unassign([fi]);return}
  const th=e.target.closest('.th');if(th)return openLB(+th.dataset.i);
  const step=e.target.closest('.step');
  if(step&&state.sel.size){
    if(step.dataset.lock){toast('Шаг проверен и закрыт — добавить нельзя','err');return}
    if(step.dataset.full){toast('Шаг уже заполнен','err');return}
    if(assign([...state.sel],step.dataset.owner,step.dataset.step))state.sel.clear();renderSelbar();return}
  const oh=e.target.closest('.obj-h');

/* ========================= ФОРМА ОБЪЕКТА ========================= */
function openObjForm(stageId,objId,ids,presetName){
  const o=objId?O(objId):null;
  const stage=stageById[stageId];
  const sel=(ids!==undefined?ids:[...state.sel]).map(i=>frameByI[i]);
  const init=o?{...o.form}:{};
  if(!o){
    const p=sel.find(f=>f.k==='plate'), inv=sel.find(f=>f.k==='inv'), bl=sel.find(f=>f.k==='building');
    if(stageId==='eq'){
      if(p)init.mark=p.ocr;
      if(inv){const m=inv.ocr.match(/(\d[\d\/]{2,})/);if(m)init.inv=m[1]}
      init.bld=lastBuilding(); init.cond='Рабочее'; init.mount='Установлено'; init.use='Эксплуатируется'; init.def='Не выявлены';
    } else {
      if(bl)init.no=bl.ocr;
      init.purpose='Производственный цех'; init.cond='Удовлетворительное'; init.access='Да';
    }
    if(presetName){ if(stageId==='eq')init.mark=presetName; else init.no=presetName }
  }
  const rows=stage.form.map(f=>{
    const hide=f.dep&&init[f.dep.k]!==f.dep.v;
    const ctl=f.opts
      ?`<select data-k="${f.k}">${['—'].concat(f.opts).map(x=>`<option${init[f.k]===x?' selected':''}>${esc(x)}</option>`).join('')}</select>`
      :`<input data-k="${f.k}" value="${esc(init[f.k]||'')}">`;
    return (f.grp?`<div class="fgrp">${esc(f.grp)}</div>`:'')+`<div class="f-row" data-row="${f.k}" ${hide?'style="display:none"':''}>
      <label>${esc(f.l)}${f.req?' <span class="req">*</span>':''}</label>${ctl}</div>`;
  }).join('');
  const hints=sel.filter(f=>f.ocr).slice(0,6);
  modal(o?'Форма · '+stage.title:'Новый повтор · '+stage.title,
    o?'Динамическая форма повторяемого этапа':
      (sel.length?`${plural(sel.length,'выделенный кадр','выделенных кадра','выделенных кадров')} разложится по шагам этапа`:'Динамическая форма повторяемого этапа'),
    rows+(hints.length?`<div style="font-size:12.5px;color:var(--muted);margin-top:10px">Распознано на выделенных кадрах:</div>
      <div class="ocrhint">${hints.map(f=>`<button data-ocr="${esc(f.ocr)}">${esc(f.ocr)}</button>`).join('')}</div>`:''),
    [{t:'Отмена'},{t:o?'Сохранить':'Создать',primary:true,fn:()=>{
      const form={};$$('#mBody [data-k]').forEach(el=>form[el.dataset.k]=el.value==='—'?'':el.value.trim());
      const need=stage.form.filter(f=>f.req&&!form[f.k]);
      if(need.length){toast('Заполните: '+need.map(f=>f.l).join(', '),'err');return false}
      if(o){o.form=form;markSaving();render();toast('Форма сохранена')}
      else{
        const ob=createObject(stageId,form);
        sel.forEach(f=>{const s=autoStep(stageId,f);if(s){f.objId=ob.id;f.stepId=s}});
        state.sel.clear();markSaving();render();toast(`Создан «${objName(ob)}»`);
      }
    }}]);
  const sync=()=>{const form={};$$('#mBody [data-k]').forEach(el=>form[el.dataset.k]=el.value);
    stage.form.filter(f=>f.dep).forEach(f=>{const r=$(`#mBody [data-row="${f.k}"]`);if(r)r.style.display=form[f.dep.k]===f.dep.v?'':'none'})};
  $$('#mBody [data-k]').forEach(el=>{el.oninput=sync;el.onchange=sync});
  $$('#mBody [data-ocr]').forEach(el=>el.onclick=()=>{
    const t=el.dataset.ocr,m=t.match(/(\d[\d\/]{2,})/);
    const first=$('#mBody [data-k="mark"]')||$('#mBody [data-k="no"]');
    const inv=$('#mBody [data-k="inv"]'), sn=$('#mBody [data-k="sn"]');
    if(/ИНВ|Инв/i.test(t)&&m&&inv)inv.value=m[1];
    else if(first&&!first.value)first.value=t;
    else if(sn&&!sn.value&&m)sn.value=m[1];
    sync();
  });
  sync();
}
function modal(title,sub,body,buttons){
  $('#mTitle').textContent=title;$('#mSub').textContent=sub||'';$('#mBody').innerHTML=body;$('#mFoot').innerHTML='';
  buttons.forEach(b=>{const el=document.createElement('button');el.className='mbtn'+(b.primary?' primary':'');el.textContent=b.t;
    el.onclick=()=>{if(b.fn&&b.fn()===false)return;$('#modal').classList.remove('show')};$('#mFoot').appendChild(el)});
  $('#modal').classList.add('show');
}

function itemHTML(owner,st,key,bound,boundLocked){
  const n=cnt(owner,st.id), full=stepFull(owner,st), frz=isFrozen(owner,st.id);
  if(bound) return `<div class="it bound" data-owner="${owner}" data-step="${st.id}"${boundLocked?' data-bl="1"':''}>
    <span class="key ok"><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M2 8.5 6 12.5 14 4"/></svg></span>
    <span class="n">${esc(st.n)}<small>${boundLocked?'привязано до вас — изменить нельзя':'кадр привязан сюда'}</small></span>
    ${boundLocked?`<span class="c">${SVG_LOCK}</span>`:'<button class="unb" data-act="unbind">Открепить</button>'}</div>`;
  return `<div class="it${frz?' lock':(full?' full':'')}" data-owner="${owner}" data-step="${st.id}"${full&&!frz?' data-full="1"':''}${frz?' data-lock="1"':''}>
    ${key&&!frz?`<span class="key">${key}</span>`:''}
    <span class="n">${esc(st.n)}<small>${frz?'проверен и закрыт — добавить нельзя':st.kind+' · '+needText(st)+(full?' · заполнен':'')}</small></span>
    <span class="c">${frz?SVG_LOCK+' ':''}${chipText(st,n)}</span></div>`;
}

function openLB(i){state.lb=lbList().findIndex(f=>f.i===i);$('#lb').classList.add('show');renderLB()}
const closeLB=()=>$('#lb').classList.remove('show');

    bind.className='lb-bind on';

    bind.innerHTML=`<span class="ico">${locked?SVG_LOCK:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M2 8.5 6 12.5 14 4"/></svg>'}</span>
      <span class="done">Распределено</span>
      <span>${f.rej?'<b>Отклонён проверяющим</b> · ':''}<b>${esc(st.n)}</b> <span class="obj">· ${esc(ownerName)}</span></span>
      <span class="sp"></span>
      <button class="act" data-act="locate">${SVG_FIND} Показать в структуре</button>
      ${locked?`<span class="obj">${esc(frameWhy(f))} — изменить нельзя</span>`
        :`<button class="act" data-act="unbind-bar">Открепить</button>`}`;
    bind.querySelector('[data-act="locate"]').onclick=()=>{closeLB();setTimeout(()=>locateFrame(f.i),120)};

    bind.querySelector('[data-act="unbind-bar"]').onclick=()=>{unassign([f.i]);renderLB()};}
  } else {
    chip.className='lbchip off'; chip.textContent='не распределён';

    bind.innerHTML=`<span class="ico"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 5v4M8 11h.01"/></svg></span>
      <span>Кадр не распределён — выберите шаг справа${state.cur?` или нажмите 1–${stageById[O(state.cur).stageId].steps.length}`:''}</span>

  const grp=(id,title,items,extra)=>`<div class="lg${state.closed.has(id)?' closed':''}" data-lg="${id}">
      <button class="lgh">${CAR}<span class="t">${esc(title)}</span><span class="c">${items.length}</span></button>
      <div class="lgb">${extra||''}${items.join('')}</div></div>`;
  let html='';

  if(state.cur){const o=O(state.cur),s=stageById[o.stageId];
    html+=grp(s.id,`Текущий · ${objName(o)}`,s.steps.map((x,k)=>itemHTML(o.id,x,k+1,isB(o.id,x.id),BL)))}
  if(f.objId&&O(f.objId)&&f.objId!==state.cur){const o=O(f.objId),s=stageById[o.stageId];
    html+=grp('bnd_'+o.id,`Привязан к · ${objName(o)}`,s.steps.map((x,k)=>itemHTML(o.id,x,k+1,isB(o.id,x.id),BL)))}
  STAGES.filter(s=>!s.rep).forEach(s=>{html+=grp(s.id,s.title,s.steps.map(x=>itemHTML(s.id,x,0,isB(s.id,x.id),BL)))});
  REPS.forEach(s=>{
    const list=objects.filter(o=>o.stageId===s.id&&o.id!==state.cur);
    const add=`<div class="it newobj" data-newobj="${s.id}">
        <span class="key">+</span><span class="n">Создать «${esc(s.title)}»<small>новый повтор, текущий кадр ляжет в него</small></span></div>`;
    const items=list.map(o=>`<div class="it setcur" data-setcur="${o.id}">
        <span class="n">${esc(objName(o))}<small>сделать текущим</small></span>
        <span class="c">${frames.filter(x=>x.objId===o.id).length}</span></div>`);
    html+=grp('rep_'+s.id,s.title+' · повторы',items,add);
  });
  $('#lbList').innerHTML=html;
}
function flashBind(after){

/* Подбор шага для одного кадра — тот же автомат, но на один кадр и с явным подтверждением */
function suggestFor(f){
  const b=(window.VA_BLOCKS||[]).find(b=>f.i>=b.a&&f.i<=b.b);
  if(!b)return null;
  if(b.kind==='terr')return {owner:'gen',stepId:f.k==='plan'?'g1':'g4'};
  const stageId=b.kind==='bld'?'bld':'eq';
  const stepId=stageId==='eq'?autoStepEq(f):(f.k==='building'?'b1':'b2');
  const o=stageId==='eq'
    ?(b.inv&&objects.find(x=>x.stageId==='eq'&&x.form.inv===b.inv))||objects.find(x=>x.stageId==='eq'&&!x.form.inv&&x.form.mark===b.title)
    :objects.find(x=>x.stageId==='bld'&&x.form.no===(b.shop||b.title));
  if(o)return {owner:o.id,stepId};
  if(stageId==='eq'&&!b.inv)return null;      // идентификатор не распознан — не угадываем
  return {create:stageId,title:b.shop||b.title,inv:b.inv||'',stepId};
}
function lbSuggest(){
  const f=lbList()[state.lb];if(!f)return;
  const sg=suggestFor(f), bind=$('#lbBind');
  if(!sg){toast('Не удалось подобрать: идентификатор рядом с кадром не распознан','err');return}
  if(sg.create){
    const st=stageById[sg.create];
    bind.innerHTML=`<span class="ico">${SVG_WAND}</span>
      <span>Похоже на новый объект: <b>${esc(sg.title)}</b>${sg.inv?` <span class="obj">· инв. ${esc(sg.inv)}</span>`:''}</span>
      <span class="sp"></span>
      <button class="act" data-act="mk">Создать «${esc(st.title)}»</button>
      <button class="act" data-act="no">Не то</button>`;
    bind.querySelector('[data-act="mk"]').onclick=()=>openObjForm(sg.create,null,[f.i],sg.title);
    bind.querySelector('[data-act="no"]').onclick=renderLB;
    return;
  }
  const stage=ownerStage(sg.owner),st=stage.steps.find(x=>x.id===sg.stepId);
  const nm=O(sg.owner)?objName(O(sg.owner)):stage.title;
  const blocked=isFrozen(sg.owner,sg.stepId)?'шаг проверен и закрыт':(stepFull(sg.owner,st)?'шаг уже заполнен':'');
  bind.innerHTML=`<span class="ico">${SVG_WAND}</span>
    <span>Предложение: <b>${esc(st.n)}</b> <span class="obj">· ${esc(nm)}</span>${blocked?` <span class="obj">— ${blocked}</span>`:''}</span>
    <span class="sp"></span>
    ${blocked?'':`<button class="act" data-act="ok">Принять <span class="kbd">Enter</span></button>`}
    <button class="act" data-act="no">Не то</button>`;
  if(!blocked){const ok=()=>lbAssign(sg.owner,sg.stepId);bind.querySelector('[data-act="ok"]').onclick=ok;bind.dataset.enter='1';window._lbOk=ok}
  bind.querySelector('[data-act="no"]').onclick=()=>{delete bind.dataset.enter;renderLB()};
}
/* Сценарий 1 — кадр не распределён: клик, плашка, автопереход.
   Сценарий 2 — кадр уже распределён: конферм, без автоперехода. */
function lbAssign(owner,stepId){
  const f=lbList()[state.lb];if(!f)return;
  if(f.lock||f.rej){toast(frameWhy(f)+' — перенести нельзя','err');return}
  const stage=ownerStage(owner),st=stage.steps.find(x=>x.id===stepId);
  if(isFrozen(owner,stepId)){toast('Шаг проверен и закрыт — добавить нельзя','err');return}
  if(stepFull(owner,stepId&&st.id)&&!(f.objId===owner&&f.stepId===stepId)){toast('Шаг уже заполнен','err');return}
  if(f.objId){
    const cs=ownerStage(f.objId).steps.find(x=>x.id===f.stepId);
    const from=(O(f.objId)?objName(O(f.objId)):ownerStage(f.objId).title)+' · '+(cs?cs.n:'—');
    const to=(O(owner)?objName(O(owner)):stage.title)+' · '+st.n;
    modal('Перенести кадр?','Кадр уже распределён — перенос это тот же выбор шага, но с подтверждением',
      `<div class="sum warn"><b>Откуда</b>${esc(from)}</div><div class="sum ok"><b>Куда</b>${esc(to)}</div>
       <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">После переноса автоматического перехода к следующему кадру не будет — останетесь здесь.</p>`,
      [{t:'Отмена'},{t:'Перенести',primary:true,fn:()=>{
        if(assign([f.i],owner,stepId,true)){renderLB();flashBind()}
      }}]);
    return;
  }
  if(assign([f.i],owner,stepId,true)){renderLB();flashBind(()=>lbStep(1))}
}
$('#lbList').onclick=e=>{
  const h=e.target.closest('.lgh');
  if(h){const id=h.parentElement.dataset.lg;state.closed.has(id)?state.closed.delete(id):state.closed.add(id);renderLB();return}
  const nb=e.target.closest('[data-newobj]');
  if(nb){const f0=lbList()[state.lb];return openObjForm(nb.dataset.newobj,null,f0?[f0.i]:[])}
  const sc=e.target.closest('[data-setcur]');
  if(sc){state.cur=sc.dataset.setcur;state.open.add(state.cur);render();renderLB();
    toast(`Текущий: ${objName(O(state.cur))}`);return}
  const it=e.target.closest('.it');if(!it||!it.dataset.owner)return;
  const f=lbList()[state.lb];if(!f)return;
  if(it.classList.contains('bound')){
    if(it.dataset.bl){toast(frameWhy(f)+' — открепить нельзя','err');return}
    unassign([f.i]);renderLB();return}
  if(it.dataset.lock){toast('Шаг проверен и закрыт — добавить нельзя','err');return}
  lbAssign(it.dataset.owner,it.dataset.step);
};
const lbStep=d=>{const l=lbList();state.lb=Math.max(0,Math.min(l.length-1,state.lb+d));renderLB()};
$('#lbPrev').onclick=()=>lbStep(-1);$('#lbNext').onclick=()=>lbStep(1);$('#lbClose').onclick=closeLB;

/* ========================= КЛАВИАТУРА ========================= */
document.addEventListener('keydown',e=>{
  const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){if($('#lb').classList.contains('show'))closeLB();
    else if($('#modal').classList.contains('show'))$('#modal').classList.remove('show');else clearSel();return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoLast();return}
  if(typing)return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='a'){e.preventDefault();$('#btnSelAll').click();return}
  const lbOpen=$('#lb').classList.contains('show');
  if(lbOpen){
    if(e.key==='Enter'&&window._lbOk){e.preventDefault();window._lbOk();return}
    if(e.key==='ArrowLeft')return lbStep(-1);
    if(e.key==='ArrowRight')return lbStep(1);
    if(e.key==='Backspace'||e.key==='Delete'){
      const f=lbList()[state.lb];
      if(f&&(f.lock||f.rej)){toast(frameWhy(f)+' — открепить нельзя','err');return}
      if(f&&f.objId){unassign([f.i]);renderLB()}else toast('Кадр и так не распределён');
      return;
    }
  }
  if(/^[1-9]$/.test(e.key)){
    if(!state.cur){toast('Сначала выберите текущий объект','err');return}
    const o=O(state.cur),st=stageById[o.stageId].steps[+e.key-1];if(!st)return;
    if(lbOpen){lbAssign(o.id,st.id);return}
    if(state.sel.size&&assign([...state.sel],o.id,st.id)){state.sel.clear();renderSelbar()}
    return;
  }
  if(e.key==='Backspace'||e.key==='Delete'){if(state.sel.size){unassign([...state.sel]);state.sel.clear();renderSelbar()}}
});

  const bad=[];
  STAGES.filter(s=>!s.rep).forEach(s=>s.steps.forEach(x=>{if(x.req&&!stepOk(s.id,x))bad.push(`${s.title} — «${x.n}»`)}));
  objects.forEach(o=>stageById[o.stageId].steps.forEach(x=>{if(x.req&&!stepOk(o.id,x))bad.push(`${objName(o)} — «${x.n}»`)}));
  const nb=objects.filter(o=>o.stageId==='bld').length,ne=objects.filter(o=>o.stageId==='eq').length;
  const pre=frames.filter(f=>isMedia(f)&&f.lock).length;
  const frz=frzSteps();
  let html=`<div class="sum ok"><b>Оформлено: ${plural(nb,'здание','здания','зданий')}, ${plural(ne,'единица','единицы','единиц')} оборудования</b>
    Из свободной съёмки разложено ${placed} из ${media.length}${pre?`. Плюс ${pre} кадров были закреплены до вас`:''}</div>`;
  if(frz)html+=`<div class="sum ok"><b>Проверено и заморожено шагов: ${frz}</b>Их содержимое уходит в Core без изменений.</div>`;
  if(general.number&&Number(general.number)!==ne)
    html+=`<div class="sum warn"><b>Расхождение с общей формой</b>По документам ${general.number} объектов, оформлено ${ne}. Заполните «Имущество, которое не удалось осмотреть».</div>`;
  if(bad.length)html+=`<div class="sum err"><b>Не закрыты обязательные шаги: ${bad.length}</b>
    <ul>${bad.slice(0,6).map(x=>`<li>${esc(x)}</li>`).join('')}${bad.length>6?`<li>…и ещё ${bad.length-6}</li>`:''}</ul></div>`;
  if(left)html+=`<div class="sum warn"><b>Не распределено: ${plural(left,'кадр','кадра','кадров')}</b>Останутся в свободной съёмке.</div>`;
  html+=`<p style="font-size:12.5px;color:var(--muted);margin:12px 0 0">Голосовые комментарии не распределяются и остаются в свободной съёмке как есть.</p>`;
  modal('Завершить распределение?','Привязки уйдут в Core',html,[{t:'Продолжить'},{t:'Завершить',primary:true,fn:()=>toast('Отправлено в Core (демо)')}]);
};

function showEntry(){
  const free=freeFrames(), left=free.filter(f=>!f.objId).length;
  const pre=frames.filter(f=>isMedia(f)&&f.lock).length;
  const fromStep=frames.filter(f=>isMedia(f)&&f.origin==='step').length;
  const notes=frames.filter(f=>!isMedia(f)).length;
  const frz=frzSteps();
  let body='';
  if(scen==='empty')
    body=`<div class="sum warn"><b>Осмотр пустой</b>Ни один шаг не заполнен, повторов нет — вся структура появится из свободной съёмки.</div>`;
  else if(scen==='mixed')
    body=`<div class="sum ok"><b>Осмотр непустой: ${plural(pre,'кадр','кадра','кадров')} уже в шагах</b>
        Их сняли обычным способом прямо по схеме — закрыты «Общие данные осмотра» и здание ЦЕХ-6.
        Такие кадры помечены синим, их нельзя открепить и они не участвуют в распределении.</div>`;
  else
    body=`<div class="sum ok"><b>Осмотр уже проверен частично: ${plural(frz,'шаг','шага','шагов')} заморожено</b>
        Проверяющий прошёл по схеме 20 июня. Шаги с решением «Ок» закрыты: дописать туда нельзя,
        открепить оттуда тоже. Они помечены замком.</div>
      <div class="sum warn"><b>По шагу «Общий вид» линии POLYPRISE вынесено «Повторить»</b>
        Старые кадры помечены отклонёнными и остаются в истории, но место в шаге освободилось — нужно переснять и разложить заново.</div>
      <div class="sum warn"><b>${plural(pre,'кадр','кадра','кадров')} привязано до вас</b>
        ${plural(fromStep,'кадр','кадра','кадров')} сняты прямо в шагах, ${plural(pre-fromStep,'кадр','кадра','кадров')} разложены из свободной съёмки в прошлый заход.
        Счётчик «Кадры разложены» считает только вашу работу.</div>`;
  body+=`<div class="sum warn"><b>Свободная съёмка: ${plural(left,'кадр','кадра','кадров')} не распределено</b>
      Плюс ${notes} голосовых и текстовых заметок — они остаются как контекст.</div>
    <div class="scen"><span>Состояние осмотра:</span>${SCEN.map(k=>
      `<button data-scen="${k}"${k===scen?' class="on"':''}>${SCEN_T[k]}</button>`).join('')}</div>`;
  modal('Распределение свободной съёмки','208 кадров и 8 видео, 13 июня 2018, 09:43–11:40',body,
    [{t:'Разложу вручную'},{t:'Распределить автоматически',primary:true,fn:()=>setTimeout(magicWand,80)}]);
  $$('#mBody [data-scen]').forEach(b=>b.onclick=()=>{
    applyScenario(b.dataset.scen);
    $('#modal').classList.remove('show');setTimeout(showEntry,120);
  });
}
